apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: argocd-initial-admin-secret
  namespace: argocd
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: argocd-initial-admin-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: password
      remoteRef:
        key: argocd
        property: password