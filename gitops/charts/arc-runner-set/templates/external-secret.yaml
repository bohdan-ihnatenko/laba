# GitHub App App ID / Installation ID / приватный ключ — заводятся вручную
# один раз в GitHub UI (см. README.md, "Self-hosted runners (ARC)") и
# кладутся в Vault, тем же способом, что и R2-креды для pgBackRest
# (secret/petclinic/r2-backup) — руками через Vault UI/CLI, не терраформом.
#
# Namespace берём из .Release.Namespace, а не хардкодим — секрет должен
# физически лежать в том же неймспейсе, что и сам runner scale set (этого
# явно требует ARC: поле githubConfigSecret ищет Secret локально в своём
# неймспейсе), а неймспейс задаётся в destination у ArgoCD Application
# (gitops/x-system/apps/arc-runner-set.yaml), не здесь.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: arc-github-app-creds
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: arc-github-app-creds
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    # Имена ключей ниже (github_app_id / github_app_installation_id /
    # github_app_private_key) — не наша выдумка, а то, чего ждёт офчарт
    # gha-runner-scale-set при githubConfigSecret (см. его values.yaml).
    - secretKey: github_app_id
      remoteRef:
        key: arc/github-app # путь в KV: secret/arc/github-app
        property: app-id
    - secretKey: github_app_installation_id
      remoteRef:
        key: arc/github-app
        property: installation-id
    - secretKey: github_app_private_key
      remoteRef:
        key: arc/github-app
        property: private-key
