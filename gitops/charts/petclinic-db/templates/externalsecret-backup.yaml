# Креды для pgBackRest → Cloudflare R2 (repo1 в postgrescluster.yaml).
#
# Access Key ID / Secret Access Key для R2 нельзя завести терраформом (см.
# комментарий в terraform/01-platform/cloudflare-r2.tf) — заводятся вручную
# один раз через Cloudflare Dashboard → R2 → Manage R2 API Tokens, и потом
# кладутся в Vault (secret/petclinic/r2-backup, поля access-key/secret-key),
# ровно тем же способом, что и пароль Postgres в externalsecret.yaml рядом.
#
# ВАЖНО: в отличие от того ExternalSecret'а, тут используется target.template —
# pgBackRest ожидает не отдельные ключи в Secret, а ОДИН файл "s3.conf" в
# формате INI (см. официальный пример CrunchyData: kustomize/s3/s3.conf.example).
# ESO собирает этот файл из двух значений, вытащенных из Vault.
#
# КРИТИЧНО: этот файл лежит в Helm-чарте (gitops/charts/petclinic-db/templates),
# а Helm сам прогоняет ВСЕ файлы templates/ через свой Go-template движок ДО
# применения в кластер. {{ .accessKey }}/{{ .secretKey }} ниже - это синтаксис
# ESO (его движок рендерит их уже ПОСЛЕ применения, читая значения из Vault),
# но для Helm это выглядит как ЕГО собственный template-expression: Helm ищет
# .accessKey в контексте values чарта, не находит и тихо подставляет пустоту -
# ESO эти плейсхолдеры уже никогда не видит. Из-за этого repo1-s3-key всегда
# приходил в pgBackRest пустым и R2-бакет для бэкапов был пуст с самого начала,
# а не только после сегодняшнего инцидента.
#
# Фикс - экранировать {{ }} стандартным Helm-приёмом {{ "{{ ... }}" }}, чтобы
# Helm вывел их как литеральный текст, а не попытался вычислить сам. ESO потом
# видит настоящий {{ .accessKey }} в уже отрендеренном манифесте и подставляет
# туда значение из Vault как и задумано.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: petclinic-pgbackrest-s3-creds
  namespace: petclinic
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: petclinic-pgbackrest-s3-creds
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      mergePolicy: Replace
      data:
        s3.conf: |
          [global]
          repo1-s3-key={{ "{{ .accessKey }}" }}
          repo1-s3-key-secret={{ "{{ .secretKey }}" }}
  data:
    - secretKey: accessKey
      remoteRef:
        key: petclinic/r2-backup
        property: access-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: secretKey
      remoteRef:
        key: petclinic/r2-backup
        property: secret-key
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
