# ВАЖНО — ручной bootstrap-шаг один раз после первого создания PostgresCluster:
# PGO сам генерит РЕАЛЬНЫЕ креды в Secret petclinic-pguser-petclinic (namespace
# petclinic, создаётся автоматически) со случайным паролем — PGO остаётся
# источником правды и может ротировать его сам. Нужно скопировать оттуда
# значения в Vault (secret/petclinic/db), ровно так же, как мы вручную завели
# secret/grafana:
#
#   kubectl get secret petclinic-pguser-petclinic -n petclinic -o json \
#     | jq -r '.data | map_values(@base64d)'
#
#   # в Vault UI (Secrets → secret → создать petclinic/db) положить туда
#   # 3 поля: user, password, jdbc-uri — значениями из вывода выше.
#
# Дальше этот ExternalSecret зеркалит их из Vault в petclinic-vault-secrets,
# которым уже питается сам под PetClinic — Vault тут просто слой доставки
# в приложение, тот же паттерн, что и в компании (PGO/секрет генерируется
# оператором, Vault используется как единая точка раздачи в кластер).
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: petclinic-vault-secrets
  namespace: petclinic
spec:
  refreshInterval: 30s
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: petclinic-vault-secrets
    creationPolicy: Owner
    # CRD-дефолт, который иначе API-сервер подставляет сам после apply и
    # ArgoCD вечно видит "разницу" с git — пишем явно, чтобы desired == live
    # (та же идея, что и с pin'ом adminPassword у Grafana: убираем причину
    # диффа, а не глушим её через ignoreDifferences).
    deletionPolicy: Retain
  data:
    - secretKey: jdbc-uri
      remoteRef:
        key: petclinic/db
        property: jdbc-uri
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: user
      remoteRef:
        key: petclinic/db
        property: user
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
    - secretKey: password
      remoteRef:
        key: petclinic/db
        property: password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
