apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging
spec:
  version: "9.5.4" # держим в паре с version у Elasticsearch (elasticsearch.yaml)
  count: 1
  elasticsearchRef:
    name: logs
  # ECK сам создаёт технического юзера kibana_system и прокидывает Kibana
  # креды/CA для связи с Elasticsearch через elasticsearchRef - руками
  # никакой Secret для этого создавать не нужно, в отличие от Fluent Bit
  # (там мы внешний неоперируемый ECK-ом клиент, поэтому там креды и ca.crt
  # монтируем вручную).
  http:
    tls:
      selfSignedCertificate:
        disabled: true
        # В отличие от Elasticsearch, Kibana торчит наружу через
        # gitops/routes/kibana.yaml -> Traefik Gateway, а наш HTTPRoute (как
        # и у Grafana/PetClinic) идёт плоским HTTP до backendRef, без
        # переупаковки TLS на этом хопе. Если оставить самоподписанный
        # сертификат ECK на самой Kibana, получится https-бэкенд с
        # untrusted-сертификатом за плоским HTTPRoute - Traefik так просто
        # не умеет, пришлось бы городить отдельный TLSRoute/passthrough.
        # Для лабы проще отключить TLS именно на этом последнем хопе -
        # трафик и так не покидает pod-to-pod сеть кластера.
  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            # Было 200m/500m CPU и 512Mi/1Gi memory - реальный бутстрап этой
            # версии Kibana поднимает 203 плагина (см. лог старта) и с таким
            # лимитом либо не укладывается по памяти (OOMKilled), либо
            # настолько задыхается по CPU, что не успевает стартовать до
            # срабатывания liveness-пробы. Подняли до значений, реально
            # достаточных для дев-стенда.
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 2Gi
