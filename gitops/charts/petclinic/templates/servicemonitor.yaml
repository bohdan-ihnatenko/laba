apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    # Обязательно: у kube-prometheus-stack по умолчанию
    # serviceMonitorSelectorNilUsesHelmValues=true — это значит, что
    # Prometheus подхватывает только ServiceMonitor'ы с лейблом
    # release: <имя релиза>. Наш релиз называется "kube-prometheus-stack"
    # (по имени файла apps/kube-prometheus-stack.yaml). Без этого лейбла
    # Prometheus просто никогда не увидит этот ServiceMonitor.
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
