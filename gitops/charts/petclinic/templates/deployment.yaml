apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: {{ .Release.Name }}
  annotations:
    # Reloader (gitops/x-system/apps/reloader.yaml) следит за секретами/
    # конфигмапами, которые реально используются в поде (env/envFrom/volume),
    # и катит rolling restart, когда они меняются. У нас POSTGRES_URL/USER/
    # PASS читаются из petclinic-vault-secrets (ESO из Vault, см.
    # externalsecret.yaml в чарте petclinic-db) — без этой аннотации смена
    # пароля в Vault обновит сам Secret, но под продолжит работать со старым
    # значением, пока кто-то не перезапустит его руками.
    reloader.stakater.com/auto: "true"
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            # Форсируем /actuator/prometheus на случай, если в самом форке
            # это не включено по умолчанию — env-переменные Spring Boot
            # перекрывают файловый application-postgres.properties в любом
            # случае, конфликтов не будет, даже если там уже включено.
            - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
              value: "health,info,prometheus"
            - name: MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS
              value: "always"
            # Включаем гистограммные бакеты (http_server_requests_seconds_bucket),
            # иначе Grafana-панели с histogram_quantile() (P95 latency) не по чему
            # считать - Micrometer по умолчанию их не генерирует, чтобы не раздувать
            # кардинальность метрик. Для лабы с одним подом/низким RPS это не
            # проблема; в проде обычно включают точечно на конкретные SLO,
            # а не глобально на все http.server.requests.
            #
            # ВАЖНО про имя env-переменной: свойство называется
            # management.metrics.distribution.percentiles-histogram.http.server.requests
            # (дефис внутри "percentiles-histogram"). По правилам relaxed
            # binding в Spring Boot точки становятся подчёркиванием, а вот
            # ДЕФИСЫ ПРОСТО УДАЛЯЮТСЯ (не заменяются на подчёркивание) - см.
            # официальный пример в доке: spring.main.log-startup-info ->
            # SPRING_MAIN_LOGSTARTUPINFO. Если поставить подчёркивание вместо
            # дефиса (PERCENTILES_HISTOGRAM), Spring Boot прочитает это как
            # ДВА разных сегмента пути и попадёт в другое, реально
            # существующее свойство management.metrics.distribution.percentiles
            # (мапа "имя метрики -> double[]"), получит на вход строку "true"
            # вместо чисел и упадёт на старте с ConversionFailedException -
            # именно так и было при первой попытке.
            - name: MANAGEMENT_METRICS_DISTRIBUTION_PERCENTILESHISTOGRAM_HTTP_SERVER_REQUESTS
              value: "true"
            # Креды из petclinic-vault-secrets (ESO из Vault secret/petclinic/db) —
            # см. комментарий в externalsecret.yaml чарта petclinic-db про
            # bootstrap-копирование пароля, который реально сгенерил PGO.
            #
            # Как и с GF_SECURITY_ADMIN_PASSWORD у Grafana: эти env читаются
            # только при старте контейнера. Поменяется значение в Vault —
            # сам Secret обновится (ESO, refreshInterval 30s), а этому поду
            # нужен будет рестарт, чтобы подхватить новое значение.
            - name: POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: petclinic-vault-secrets
                  key: jdbc-uri
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: petclinic-vault-secrets
                  key: user
            - name: POSTGRES_PASS
              valueFrom:
                secretKeyRef:
                  name: petclinic-vault-secrets
                  key: password
            # HikariCP держит соединения к Postgres живыми дольше, чем
            # хочет инфраструктура между нами и БД (после переезда
            # petclinic в mesh - Envoy, дефолтный tcp_proxy idle_timeout
            # ~1ч) - пул не знал об этом лимите и просто натыкался на уже
            # закрытые сокеты при следующем запросе (HikariPool WARN
            # "Failed to validate connection ... has been closed",
            # 14-21с на восстановление пула = валит readiness/liveness).
            # Ставим maxLifetime заметно меньше инфраструктурного лимита
            # (10 мин), чтобы Hikari сам проактивно пересоздавал
            # соединения ДО того, как их прибьёт снаружи - фикс на
            # стороне приложения, не зависит от того, что стоит между
            # нами и Postgres сейчас или в будущем.
            #
            # ВАЖНО про имя переменной: свойство
            # spring.datasource.hikari.max-lifetime - дефис в "max-lifetime"
            # по relaxed binding УДАЛЯЕТСЯ, а не заменяется на подчёркивание
            # (тот же гоцик, что и с percentiles-histogram выше), поэтому
            # SPRING_DATASOURCE_HIKARI_MAXLIFETIME, а не _MAX_LIFETIME.
            - name: SPRING_DATASOURCE_HIKARI_MAXLIFETIME
              value: "600000" # 10 минут в мс
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu }}
              memory: {{ .Values.resources.requests.memory }}
            limits:
              cpu: {{ .Values.resources.limits.cpu }}
              memory: {{ .Values.resources.limits.memory }}
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5 # дефолт k8s - 1с, замало для JVM: перший
              # запит лінива ініціалізація DispatcherServlet + можлива
              # затримка sidecar встигали зловити один такий таймаут
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
