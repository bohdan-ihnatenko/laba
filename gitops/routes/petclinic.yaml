apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: petclinic
  namespace: petclinic
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
  hostnames:
    - "petclinic.hydranoid.site"
  rules:
    - backendRefs:
        - name: petclinic
          port: 8080
