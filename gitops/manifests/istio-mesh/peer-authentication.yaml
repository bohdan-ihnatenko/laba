# Istio требует: portLevelMtls допустим ТОЛЬКО на PeerAuthentication с
# явным selector (workload-specific) - на namespace-wide объекте (без
# selector) API-сервер такой объект целиком отклоняет валидирующим
# вебхуком ("portLevelMtls requires selector"), никакая часть не
# применяется вообще. Поэтому на каждый неймспейс - по два объекта:
# один namespace-wide (default STRICT для всех подов), второй -
# workload-specific с selector на конкретный под, где нужно исключение
# по порту. Workload-specific объект без верхнеуровневого spec.mtls.mode
# ничего не переопределяет для остальных портов этого пода - они
# по-прежнему наследуют STRICT от namespace-wide объекта, только явно
# перечисленные в portLevelMtls порты получают исключение.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: strict-mtls
  namespace: vault
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
# selector - под vault-0 (chart hashicorp/vault, лейбл
# app.kubernetes.io/name=vault, проверено kubectl get pod --show-labels).
# Порт 8200 - туда Traefik (ns traefik, вне mesh) шлёт HTTPRoute
# vault.hydranoid.site plaintext'ом, сертификата от istiod у него нет.
metadata:
  name: vault-ui-port-exception
  namespace: vault
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  portLevelMtls:
    8200:
      mode: PERMISSIVE
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: strict-mtls
  namespace: external-secrets
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: PeerAuthentication
# selector - конкретно под eso-external-secrets-webhook (лейбл
# app.kubernetes.io/name=external-secrets-webhook), НЕ основной контроллер
# eso-external-secrets и не cert-controller - вебхук на 10250 висит
# отдельным Deployment'ом (проверено kubectl get pod --show-labels).
# Этот порт напрямую дёргает kube-apiserver при валидации ExternalSecret/
# SecretStore - apiserver вне mesh, сертификата от istiod тоже не имеет.
metadata:
  name: webhook-port-exception
  namespace: external-secrets
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: external-secrets-webhook
  portLevelMtls:
    10250:
      mode: PERMISSIVE
