# УСТАРЕЛО (2026-09-23): раньше здесь лежали полноценные объекты Namespace
# для vault/external-secrets/petclinic с лейблом istio-injection - отдельным
# Application (istio-mesh-namespaces), который трекал и прунил эти Namespace
# как СВОИ ресурсы. Именно это снесло целиком vault/external-secrets/
# petclinic (со всем содержимым) при удалении того Application - см.
# инцидент 2026-09-23 (Vault ушёл в Initialized: false).
#
# Лейбл istio-injection теперь навешивается через syncPolicy.
# managedNamespaceMetadata прямо в apps/vault.yaml и apps/eso.yaml -
# ArgoCD патчит метадату на уже существующий Namespace (созданный
# CreateNamespace=true у того же Application), но НЕ берёт сам Namespace
# как трекаемый/прунимый ресурс. Каскадное удаление неймспейса из-за
# удаления Application физически больше невозможно для этих двух.
#
# Файл оставлен пустым (без манифестов) намеренно - ArgoCD Application
# istio-mesh-policies по-прежнему синкает всю папку gitops/manifests/
# istio-mesh целиком, так что любой Namespace-объект, случайно возвращённый
# в этот файл, снова попадёт под prune этого Application. Не добавлять
# сюда объекты kind: Namespace без крайней необходимости.
