apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
spec:
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  refreshInterval: 1h
  target:
    name: grafana-admin-credentials
    creationPolicy: Owner
    template:
      # Replace, а не Merge: в итоговом Secret'е нужны только admin-user/
      # admin-password — сырой ключ из data ниже нам самим по себе не нужен,
      # он тут просто промежуточная переменная для шаблона.
      mergePolicy: Replace
      data:
        admin-user: "admin"
        admin-password: "{{ .adminPassword }}"
  data:
    - secretKey: adminPassword
      remoteRef:
        key: grafana       # путь в KV: secret/grafana (mount "secret" уже задан в ClusterSecretStore)
        property: grafana  # имя поля внутри секрета, как ты его создал в Vault UI
