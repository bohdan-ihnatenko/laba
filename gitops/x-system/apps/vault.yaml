project: default
source:
  repoURL: https://helm.releases.hashicorp.com
  chart: vault
  targetRevision: "0.29.1" # проверьте актуальную: helm search repo hashicorp/vault -l
  helm:
    values: |
      # Верхнеуровневый ui.enabled ниже создаёт только k8s Service для UI —
      # само включение UI внутри Vault делает строка "ui = true" в HCL-конфиге.
      # Раз мы задаём server.standalone.config целиком сами (свой listener/
      # storage), дефолтный конфиг чарта (где "ui = true" уже есть) не
      # используется — поэтому её нужно прописать явно самим, иначе UI молчит
      # независимо от ui.enabled.
      ui:
        enabled: true
      server:
        dev:
          enabled: false
        standalone:
          enabled: true
          # tls_disable=true — тот же принцип, что и с ArgoCD/cloudflared:
          # внешний TLS целиком на Cloudflare edge, внутри кластера — plain HTTP.
          config: |
            ui = true
            listener "tcp" {
              address     = "0.0.0.0:8200"
              tls_disable = true
            }
            storage "file" {
              path = "/vault/data"
            }
        dataStorage:
          enabled: true
          size: 1Gi
          storageClassName: local-path
      # Agent Injector не нужен — секреты в поды будет тянуть External Secrets
      # Operator через Vault API, а не через sidecar-инжект.
      injector:
        enabled: false
destination:
  namespace: vault
syncPolicy:
  # Лейбл через managedNamespaceMetadata, а не отдельным Application с
  # полноценным объектом Namespace (как было раньше в istio-mesh-namespaces).
  # managedNamespaceMetadata просто патчит метадату на неймспейс, который и
  # так создаёт CreateNamespace=true у этого же Application - ArgoCD НЕ
  # берёт Namespace как отдельный трекаемый/прунимый ресурс. Именно
  # прун полноценного Namespace-объекта из отдельного Application снёс
  # сегодня vault/external-secrets/petclinic целиком при удалении того
  # Application - см. инцидент 2026-09-23.
  managedNamespaceMetadata:
    labels:
      istio-injection: enabled
