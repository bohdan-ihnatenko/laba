project: default
source:
  repoURL: https://charts.external-secrets.io
  chart: external-secrets
  targetRevision: "0.10.7" # проверьте актуальную: helm search repo external-secrets/external-secrets -l
  helm:
    values: |
      installCRDs: true
      # Без этого чарт называет ServiceAccount по схеме "<релиз>-<чарт>" —
      # у нас релиз называется "eso" (по имени файла apps/eso.yaml), так что
      # получилось бы "eso-external-secrets". А в vault-auth.tf (bound_service_
      # account_names) и в ClusterSecretStore (serviceAccountRef.name) жёстко
      # зашито "external-secrets" — фиксируем имя явно, чтобы всё совпадало.
      serviceAccount:
        name: external-secrets
destination:
  namespace: external-secrets
