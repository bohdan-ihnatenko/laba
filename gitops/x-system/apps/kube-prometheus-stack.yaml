project: default
source:
  repoURL: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  targetRevision: "91.4.1" # проверьте актуальную: helm search repo prometheus-community/kube-prometheus-stack -l
  helm:
    values: |
      prometheus:
        prometheusSpec:
          retention: 3d
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                resources:
                  requests:
                    storage: 5Gi
      alertmanager:
        alertmanagerSpec:
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                resources:
                  requests:
                    storage: 1Gi
      grafana:
        image:
          repository: grafana/grafana
          tag: "13.1.1"
        persistence:
          enabled: true
          storageClassName: local-path
          size: 2Gi
        # ВРЕМЕННО (lab-only): фиксируем admin-пароль явным значением вместо
        # случайной генерации. Чарт по умолчанию генерирует admin-password
        # заново при КАЖДОМ рендере Helm, и это значение попадает не только
        # в Secret, но и хэшируется в pod-template аннотацию Deployment'а
        # (checksum/secret) — из-за этого Deployment тоже вечно OutOfSync,
        # а сама Grafana после каждого рестарта видит "новый" пароль и падает
        # с 401 на внутренних вызовах /api/admin/provisioning/*/reload, потому
        # что под капотом провижининг всё ещё аутентифицируется старым.
        # Уберём, когда прикрутим ESO/Vault под Grafana (как для PetClinic).
        adminPassword: "lab-grafana-admin-CHANGE-ME"
destination:
  namespace: monitoring
syncPolicy:
  extraSyncOptions:
    - ServerSideApply=true
# Чарт генерирует admin-password/admin-user/ldap-toml случайной строкой при
# КАЖДОМ рендере (а не один раз при первой установке) — ArgoCD из-за этого
# вечно видит "разницу" между тем, что в кластере, и тем, что только что
# нарендерил Helm. Говорим ArgoCD не сравнивать именно эти поля секрета —
# как только он один раз создан, его реальное содержимое больше не трогаем.
# Когда прикрутим ESO/Vault под Grafana (как для PetClinic), эта секция уйдёт.
ignoreDifferences:
  - group: ""
    kind: Secret
    name: kube-prometheus-stack-grafana
    namespace: monitoring
    jsonPointers:
      - /data/admin-password
      - /data/admin-user
      - /data/ldap-toml
