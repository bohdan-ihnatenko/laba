project: default
source:
  repoURL: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  targetRevision: "91.4.1" # проверьте актуальную: helm search repo prometheus-community/kube-prometheus-stack -l
  helm:
    values: |
      prometheus:
        prometheusSpec:
          retention: 3d
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                resources:
                  requests:
                    storage: 5Gi
      alertmanager:
        alertmanagerSpec:
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                resources:
                  requests:
                    storage: 1Gi
      grafana:
        image:
          repository: grafana/grafana
          tag: "13.1.1"
        persistence:
          enabled: true
          storageClassName: local-path
          size: 2Gi
        # Admin-креды больше не генерируются чартом и не лежат в git — их
        # заводит ESO (gitops/manifests/grafana-external-secret.yaml) из
        # Vault (secret/grafana) в Secret "grafana-admin-credentials".
        # Раньше чарт сам генерировал admin-password/admin-user случайной
        # строкой при каждом рендере, и это тянуло за собой вечный OutOfSync
        # на Secret и на Deployment (через checksum/secret в pod-template) —
        # existingSecret убирает эту случайность полностью, а не прячет её
        # через ignoreDifferences.
        admin:
          existingSecret: grafana-admin-credentials
          userKey: admin-user
          passwordKey: admin-password
destination:
  namespace: monitoring
syncPolicy:
  extraSyncOptions:
    - ServerSideApply=true
