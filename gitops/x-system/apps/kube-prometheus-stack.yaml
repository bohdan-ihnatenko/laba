project: default
source:
  repoURL: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  targetRevision: "91.4.1"
  helm:
    values: |
      prometheus:
        enabled: true
        prometheusSpec:
          retention: 3d
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                resources:
                  requests:
                    storage: 5Gi

      alertmanager:
        enabled: true
        alertmanagerSpec:
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                resources:
                  requests:
                    storage: 1Gi

      grafana:
        enabled: true
        image:
          repository: grafana/grafana
          tag: "13.1.1"
        # Infinity datasource plugin - позволяет ходить датасорсом в
        # произвольные REST/JSON/CSV/GraphQL источники без написания
        # отдельного бэкенда. Плагин подписан, allow_loading_unsigned_plugins
        # не нужен.
        plugins:
          - yesoreyeram-infinity-datasource
        persistence:
          enabled: true
          storageClassName: local-path
          size: 2Gi
        admin:
          existingSecret: grafana-admin-credentials
          userKey: admin-user
          passwordKey: admin-password
        # Без явного root_url Grafana подставляет в уведомления (Source/
        # Silence в Slack, ссылку в тайтле алерта) дефолтный
        # http://localhost:3000 из образа - это адрес пода изнутри кластера,
        # снаружи (в Slack) по нему никуда не попасть. root_url должен
        # совпадать с тем, что реально резолвится снаружи (см.
        # gitops/routes/grafana.yaml).
        grafana.ini:
          server:
            root_url: "https://grafana.hydranoid.site"
destination:
  namespace: monitoring
syncPolicy:
  extraSyncOptions:
    - ServerSideApply=true