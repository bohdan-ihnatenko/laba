project: default
source:
  repoURL: https://prometheus-community.github.io/helm-charts
  chart: kube-prometheus-stack
  targetRevision: "91.4.1"
  helm:
    values: |
      prometheus:
        enabled: true
        prometheusSpec:
          retention: 3d
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                resources:
                  requests:
                    storage: 5Gi

      alertmanager:
        enabled: true
        alertmanagerSpec:
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                resources:
                  requests:
                    storage: 1Gi

      grafana:
        enabled: true
        image:
          repository: grafana/grafana
          tag: "13.1.1"
        persistence:
          enabled: true
          storageClassName: local-path
          size: 2Gi
        admin:
          existingSecret: grafana-admin-credentials
          userKey: admin-user
          passwordKey: admin-password
destination:
  namespace: monitoring
syncPolicy:
  extraSyncOptions:
    - ServerSideApply=true