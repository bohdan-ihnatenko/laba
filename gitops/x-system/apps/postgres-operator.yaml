syncWave: "-1"  # PostgresCluster CRD должен появиться раньше, чем petclinic-db попробует создать свой CR
project: default
source:
  # Официальный quickstart-манифест CrunchyData Postgres Operator (kustomize) —
  # https://access.crunchydata.com/documentation/postgres-operator/latest/installation/helm
  # У них есть и Helm/OCI вариант, но kustomize заводится через ArgoCD без
  # отдельной регистрации OCI-репозитория, поэтому проще для лабы.
  # ПРОВЕРЬ актуальный тег/ветку перед применением — "main" тут временно.
  repoURL: https://github.com/CrunchyData/postgres-operator-examples.git
  targetRevision: main
  path: kustomize/install/default
destination:
  namespace: postgres-operator
