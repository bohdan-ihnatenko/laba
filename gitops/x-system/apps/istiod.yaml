syncWave: "0" # після istio-base (CRD вже стоять), до istio-mesh-namespaces
project: default
source:
  repoURL: https://istio-release.storage.googleapis.com/charts
  chart: istiod
  targetRevision: "1.31.0-rc.0"
  helm:
    values: |
      # Дефолтний профіль istiod розрахований на реальний кластер (типово
      # ~500m CPU / 2Gi memory запит на control-plane) - забагато для лаби на
      # трьох k3d-нодах, де вже крутяться Vault/ESO/kube-prometheus-stack/
      # ECK/ARC/postgres-operator. Урізаємо під розмір стенду.
      pilot:
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      # accessLogFile вимкнено (дефолт), щоб Envoy-сайдкари не плодили окремий
      # потік логів на весь k8s-logs індекс - в лабі це шум, не сигнал.
      #
      # Sidecar-injection НЕ глобальна. Istio за замовчуванням інжектить
      # сайдкар лише в неймспейси з лейблом istio-injection: enabled - у нас
      # це gitops/manifests/istio-mesh (спочатку тільки vault +
      # external-secrets, найчутливіший хоп ESO -> Vault). Розширювати на
      # інші неймспейси (petclinic, monitoring, logging...) - окремий
      # свідомий крок, не дефолт; у CrunchyData/ARC подів із сайдкаром
      # відомі свої гоцики (init-ordering, привілейовані контейнери), краще
      # це тестувати по одному неймспейсу за раз.
destination:
  namespace: istio-system
# Той самий дрейф, що й на istiod-default-validator у istio-base.yaml, але
# на ІНШИХ об'єктах - чарт istiod ставить свої власні webhook'и
# (istio-validator-istio-system, istio-sidecar-injector), окремі від
# placeholder-вебхука з чарта base. istiod (manager pilot-discovery) так
# само сам патчить їм caBundle (обом) і failurePolicy (у валідатора) через
# SSA в обхід git - ігнор на istio-base сюди не поширюється, це різні
# resource name.
ignoreDifferences:
  - group: admissionregistration.k8s.io
    kind: ValidatingWebhookConfiguration
    name: istio-validator-istio-system
    jsonPointers:
      - /webhooks/0/failurePolicy
      - /webhooks/0/clientConfig/caBundle
  - group: admissionregistration.k8s.io
    kind: MutatingWebhookConfiguration
    name: istio-sidecar-injector
    jsonPointers:
      - /webhooks/0/clientConfig/caBundle
syncPolicy:
  extraSyncOptions:
    - ServerSideApply=true
